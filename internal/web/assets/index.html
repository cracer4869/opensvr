<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>opensvr · 三协议便携开局服务端</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.svg" alt="logo" width="30" height="30">
      <div class="brand-txt">
        <h1>opensvr</h1>
        <span class="sub">三协议便携开局服务端 · FTP / SFTP / TFTP</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="all-start" class="btn ghost">全部启动</button>
      <button id="all-stop" class="btn ghost">全部停止</button>
    </div>
  </header>

  <div id="root-warn" class="warn" hidden></div>

  <main class="grid">

    <!-- 协议服务 -->
    <section class="card span-2">
      <div class="card-head"><h2>协议服务</h2><span class="hint">端口可改，回车或失焦保存</span></div>
      <div id="protos" class="protos"></div>
    </section>

    <!-- 共享根目录 -->
    <section class="card span-2">
      <div class="card-head"><h2>共享根目录</h2><span class="hint">固件 / 配置放这里，供设备拉取</span></div>
      <div class="rootcur" title="当前生效目录">📂 <span id="root-cur">—</span></div>
      <div class="rootrow">
        <button id="root-pick" class="btn primary">选择目录…</button>
        <input id="root-dir" type="text" placeholder="或手动输入路径，留空 = exe 同级 /开局文件">
        <button id="root-save" class="btn">设置</button>
      </div>
    </section>

    <!-- 性能 -->
    <section class="card span-2">
      <div class="card-head">
        <h2>吞吐性能</h2>
        <div class="legend">
          <span class="lg"><i class="dot up"></i>上行 <b id="rate-up">0 B/s</b></span>
          <span class="lg"><i class="dot down"></i>下行 <b id="rate-down">0 B/s</b></span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" height="200"></canvas>
        <div id="chart-tip" class="chart-tip" hidden></div>
      </div>
    </section>

    <!-- 当前连接 -->
    <section class="card span-2">
      <div class="card-head"><h2>当前连接</h2><span id="sess-count" class="pill muted">0</span></div>
      <table class="sess-table">
        <thead><tr><th>协议</th><th>来源</th><th>用户</th><th>动作</th><th>文件</th><th class="num">已传</th><th>开始</th></tr></thead>
        <tbody id="sessions"></tbody>
      </table>
      <div id="sess-empty" class="empty">暂无连接</div>
    </section>

    <!-- 账号 -->
    <section class="card">
      <div class="card-head"><h2>账号（明文）</h2></div>
      <div class="field"><label>用户名</label><input id="auth-user" type="text"></div>
      <div class="field"><label>密码</label><input id="auth-pass" type="text"></div>
      <label class="chk"><input id="auth-anon" type="checkbox"> 允许匿名登录</label>
      <button id="auth-save" class="btn full">保存账号</button>
    </section>

    <!-- 访问权限 -->
    <section class="card">
      <div class="card-head"><h2>访问权限</h2><span class="hint">作用于根目录及子目录 · 默认全开</span></div>
      <div class="perms">
        <label class="chk"><input type="checkbox" data-perm="read"> 读文件 / 下载</label>
        <label class="chk"><input type="checkbox" data-perm="write"> 写文件 / 上传</label>
        <label class="chk"><input type="checkbox" data-perm="list"> 列目录</label>
        <label class="chk"><input type="checkbox" data-perm="mkdir"> 新建目录</label>
        <label class="chk"><input type="checkbox" data-perm="delete"> 删除</label>
        <label class="chk"><input type="checkbox" data-perm="rename"> 改名 / 移动</label>
      </div>
      <button id="perms-save" class="btn full">保存权限</button>
    </section>

    <!-- 网卡 -->
    <section class="card span-2">
      <div class="card-head"><h2>本机网卡地址</h2><span class="hint">点 IP 复制 · 选与设备同网段的那个</span></div>
      <table class="nic-table">
        <thead><tr><th>网卡</th><th>IP</th><th>CIDR</th></tr></thead>
        <tbody id="nics"></tbody>
      </table>
      <button id="fw-btn" class="btn full">一键放行 Windows 防火墙（需管理员）</button>
      <div id="fw-msg" class="msg" hidden></div>
    </section>

    <!-- 日志 -->
    <section class="card span-2">
      <div class="card-head"><h2>实时日志</h2><button id="log-clear" class="btn sm">清屏</button></div>
      <div id="log" class="log"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
